name: Validate WPF Windows build

on:
  pull_request:
    branches:
      - master
    - fix/windows-homecard-startup
    paths:
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - '.github/workflows/validate-wpf-windows.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wpf:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./v2rayN/v2rayN.csproj
