name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'v2rayN/v2rayN/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./v2rayN/v2rayN.csproj

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
